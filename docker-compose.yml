services:
  verifier-1:
    build: ./django_verifier
    container_name: verifier-1
    env_file: .env
    environment:
      PORT: 8101
      VERIFIER_ID: verifier-1
      PRIVATE_KEY: ${ORACLE_1_PRIVATE_KEY}
      RESERVATION_CONTRACT_ADDRESS: ${RESERVATION_CONTRACT_ADDRESS}
      FORCE_DECISION: ${VERIFIER_1_DECISION:-normal}
      SIGNATURE_MODE: ${VERIFIER_1_SIGNATURE:-valid}
    network_mode: host

