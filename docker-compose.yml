services:
  oracle-1:
    build: ./verifier
    container_name: oracle-1
    env_file: .env
    environment:
      - PORT=8101
      - ORACLE_NAME=oracle-1
      - PRIVATE_KEY=${ORACLE_1_PRIVATE_KEY}
      - VERIFY_MODE=${VERIFY_MODE:-acapy}
    network_mode: "host"

  oracle-2:
    build: ./verifier
    container_name: oracle-2
    env_file: .env
    environment:
      - PORT=8102
      - ORACLE_NAME=oracle-2
      - PRIVATE_KEY=${ORACLE_2_PRIVATE_KEY}
      - VERIFY_MODE=${VERIFY_MODE:-acapy}
    network_mode: "host"

  oracle-3:
    build: ./verifier
    container_name: oracle-3
    env_file: .env
    environment:
      - PORT=8103
      - ORACLE_NAME=oracle-3
      - PRIVATE_KEY=${ORACLE_3_PRIVATE_KEY}
      - VERIFY_MODE=${VERIFY_MODE:-acapy}
    network_mode: "host"
